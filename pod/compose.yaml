# ═══════════════════════════════════════════════════════════════
#  Pod — pracovní prostředí na stroji vývojáře
#
#  Generuje se launcherem, proměnné dosazuje `docker compose` z .env
#  vedle tohohle souboru. Ručně se nespouští.
#
#  Dvě věci, na kterých stojí izolace:
#
#  1. SÍŤ. Pod je na síti s internal: true — nemá routu ven. Jediná
#     cesta vede přes egress, který je na obou sítích a pouští jen
#     domény z allowlistu.
#
#  2. SCOPE. Repozitář se připojí read-only a povolené cesty se přes
#     něj přemountují zapisovatelně (AGENTICDEV_RW_MOUNTS). Zápis mimo
#     scope tak selže na EROFS — vynucuje to jádro, ne slušnost agenta.
# ═══════════════════════════════════════════════════════════════
name: agenticdev-${AGENTICDEV_PROJECT}

networks:
  # Žádná cesta ven. Kontejner na téhle síti se dostane jen na ostatní
  # kontejnery ve stejné síti.
  isolated:
    internal: true
  outside:
    driver: bridge

services:
  # ─── Egress ───────────────────────────────────────────────────
  # Nabíhá první a pod na něj čeká. Kdyby se pořadí obrátilo, měl by
  # agent chvíli síť bez filtru.
  egress:
    build:
      context: ./egress
    image: agenticdev/egress:${AGENTICDEV_VERSION:-dev}
    networks: [isolated, outside]
    environment:
      AGENTICDEV_EGRESS_ALLOW: ${AGENTICDEV_EGRESS_ALLOW}
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "netstat -ltn | grep -q ':8888'"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 2s
    restart: "no"

  # ─── Pod ──────────────────────────────────────────────────────
  pod:
    build:
      context: .
    image: agenticdev/pod:${AGENTICDEV_VERSION:-dev}
    depends_on:
      egress: { condition: service_healthy }
    networks: [isolated]

    # Obraz má v ENTRYPOINT harness — spustit ho ale nesmíme hned. Policy
    # a token leží na tmpfs uvnitř kontejneru a launcher je tam dostane
    # (`docker cp`) až po startu. Kdyby harness naběhl jako první proces,
    # nenašel by policy, spadl by a kontejner by skončil — launcher by pak
    # neměl kam poslat `docker exec` a agent by se nespustil bez chybové
    # hlášky. Kontejner proto jen čeká; agenta smí odpálit výhradně
    # harness, kterého launcher spustí po vložení policy.
    entrypoint: ["sleep", "infinity"]

    # Uid hostitele, aby soubory ve workspace patřily člověku a ne rootovi.
    user: "${AGENTICDEV_UID}:${AGENTICDEV_GID}"

    environment:
      HTTP_PROXY:  http://egress:8888
      HTTPS_PROXY: http://egress:8888
      http_proxy:  http://egress:8888
      https_proxy: http://egress:8888
      # Bez tohohle by npm a spol. proxy obcházely pro lokální adresy.
      NO_PROXY: localhost,127.0.0.1
      AGENTICDEV_TREES: /trees
      TERM: ${TERM:-xterm-256color}

    volumes:
      # Repozitář read-only. Zapisovatelné cesty dopisuje launcher
      # do compose.override.yaml podle scope.
      - ${AGENTICDEV_REPO_DIR}:/workspace:ro
      # Kontext z VPS. Read-only i kdyby si ho agent chtěl přepsat.
      - ${AGENTICDEV_CTX_DIR}:/ctx:ro
      # Worktree rozdělaných úkolů. Musí ležet na hostiteli, jinak by
      # se s podem smazaly.
      - ${AGENTICDEV_TREES_DIR}:/trees:rw

    # Tajemství na tmpfs — po zastavení podu nezůstanou na disku.
    tmpfs:
      - /run/agenticdev:mode=0700,uid=${AGENTICDEV_UID},gid=${AGENTICDEV_GID}
      - /tmp:mode=1777

    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    # Docker socket tu záměrně není. S ním by pod mohl nastartovat
    # privilegovaný kontejner a izolace by byla na nic.

    stdin_open: true
    tty: true
    working_dir: /workspace
    restart: "no"
